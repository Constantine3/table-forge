- insert:
    - id: game-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: game-app-runtime
      name: '@deepseek-ai/dsh-game-app'

    - id: game-definitions
      name: '@deepseek-ai/dsh-game'

    - id: game-persistence
      name: '@deepseek-ai/dsh-game-persistence-sqlite'
      config:
        path: !!js dshHomePath('games.sqlite')

    - id: game-engine
      name: '@deepseek-ai/dsh-game-engine'
      inject: [gameDefinitions, gameControllers, gamePersistence]

    - id: game-rps
      name: '@deepseek-ai/dsh-game-rps'
      inject: [gameDefinitions]
      config:
        defaultRounds: 3
        maxRounds: 20

    - id: game-avalon
      name: '@deepseek-ai/dsh-game-avalon'
      inject: [gameDefinitions]
      config:
        maxStatementChars: 280

    - id: game-controller-agent
      name: '@deepseek-ai/dsh-game-controller-agent'
      inject: [agents, gameControllers, llm, matches, sessionPersistence, systemPrompt, tools]
      config:
        maxAttemptsPerAction: 2
        maxTokensPerRequest: 16384
        timeoutRetryReasoningEfforts:
          deepseek-self-deployment:
            deepseek-v4-flash-vision: high
          hy3-tokenhub:
            hy3: low
        providerProbes:
          deepseek-self-deployment:
            endpoint: http://127.0.0.1:4100/v1
            timeoutMs: 1500
        playerInstruction: >-
          规则引擎拥有最终裁决权。只有 submit_game_action 成功后才能声称动作已被接受。每次行动前必须使用最强可用推理，明确分析当前观察、历史回合、比分与目标、不确定性与隐藏信息、对手倾向、候选动作、风险和可能的反制。所有思维链、分析、最终回答和公开发言必须使用简体中文；不得使用英文书写自然语言，但 JSON 属性名、动作类型、枚举值和席位 id 必须严格遵循动作 schema。不得编造本席位无法观察的信息，也不得在公开发言中泄露私有身份或私有知识。调用 submit_game_action 前先在推理中完成分析，再提交最有可能推进自身目标的动作。

    - id: ui-game
      name: '@deepseek-ai/dsh-client-ui-game'

    - id: ui-game-rps
      name: '@deepseek-ai/dsh-client-ui-game-rps'

    - id: ui-game-avalon
      name: '@deepseek-ai/dsh-client-ui-game-avalon'
