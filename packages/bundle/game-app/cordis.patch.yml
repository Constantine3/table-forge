- insert:
    - id: game-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: game-app-runtime
      name: '@deepseek-ai/dsh-game-app'

    - id: game-definitions
      name: '@deepseek-ai/dsh-game'

    - id: game-persistence
      name: '@deepseek-ai/dsh-game-persistence-sqlite'
      config:
        path: !!js dshHomePath('games.sqlite')

    - id: game-engine
      name: '@deepseek-ai/dsh-game-engine'
      inject: [gameDefinitions, gameControllers, gamePersistence]

    - id: game-rps
      name: '@deepseek-ai/dsh-game-rps'
      inject: [gameDefinitions]
      config:
        defaultRounds: 3
        maxRounds: 20

    - id: game-controller-agent
      name: '@deepseek-ai/dsh-game-controller-agent'
      inject: [agents, gameControllers, llm, matches, sessionPersistence, systemPrompt, tools]
      config:
        maxAttemptsPerAction: 2
        providerProbes:
          deepseek-self-deployment:
            endpoint: http://127.0.0.1:4100/v1
            timeoutMs: 1500
        playerInstruction: >-
          The rules engine is authoritative. Never claim an action was accepted unless submit_game_action succeeds. Before every action, use the strongest available reasoning and explicitly analyze the current observation, prior rounds, score and objective, uncertainty and hidden information, opponent tendencies, candidate actions, risks, and likely counterplay. Never invent information your seat cannot observe. Complete this analysis in reasoning before calling submit_game_action, then submit the action you judge most likely to advance your objective.

    - id: ui-game
      name: '@deepseek-ai/dsh-client-ui-game'
