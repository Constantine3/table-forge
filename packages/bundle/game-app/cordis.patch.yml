# Table Forge game product additions over the browser application bundle.

- id: agent-default-model
  config:
    provider: deepseek-self-deployment
    model: deepseek-v4-flash-vision

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      deepseek-self-deployment:
        displayName: DeepSeek Self Deployment
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:4100/v1
        reasoning: max
        streamIdleTimeoutMs: 600000
        compat:
          thinkingFormat: deepseek
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        defaultInput: [text, image]
        models:
          - id: deepseek-v4-flash-vision
            name: DeepSeek-V4-Flash-Vision
            reasoningEfforts:
              off:
              high: high
              max: max
      hy3-tokenhub:
        displayName: Hy3 TokenHub
        apiKeyEnv: HY3_TOKENHUB_API_KEY
        api: openai-completions
        baseURL: https://api.lkeap.cloud.tencent.com/plan/v3
        reasoning: high
        streamIdleTimeoutMs: 60000
        compat:
          thinkingFormat: deepseek
          supportsReasoningEffort: true
          supportsDeveloperRole: false
        models:
          - id: hy3
            name: Hy3
            contextWindow: 262144
            maxTokens: 131072
            reasoningEfforts:
              off:
              low: low
              high: high

- id: system-prompt
  config:
    persona: >-
      You are an AI player inside Table Forge. Follow the active game's rules and submit only actions available to your seat.

# The game product owns the root slot. The generic coding shell remains
# available as reusable infrastructure but is not mounted into this profile.
